[project]
name = "yunrunrun"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gmssl==3.2.2",
    "mitmproxy>=12.3.1",
    "pillow>=13.0.0",
    "pycryptodome>=4.2.0",
    "requests>=2.34.2",
    "schedule>=1.2.2",
    "tqdm>=4.70.1",
]

[project.scripts]
yunrunrun = "yunrunrun:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
