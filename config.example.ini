# [Login] 学号密码：--login 时使用；登录会使手机端掉线，尽量少用。
# [Run] 打表参数：
#   face_status_missing：任务体没有 runFaceStatus 字段时是否按无人脸任务处理。
#     stop（默认，保守）| allow（该学校确无人脸核验时用；洛阳理工学院为 allow）
