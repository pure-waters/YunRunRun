# 配置模板：复制为 config.ini 后填写自己的学号/密码。
#   cp config.example.ini config.ini
# config.ini 已被 .gitignore 忽略（含明文密码与 token，切勿提交）。
#
[Yun]
yun_host = https://sports.aiyyd.com:8000
school_host = https://sports.aiyyd.com:8000
publickey = <仓库公共协议密钥：从原始 config.ini 复制，勿改>
privatekey = <仓库公共协议密钥：从原始 config.ini 复制，勿改>
cipherkeyencrypted = <仓库公共协议密钥：从原始 config.ini 复制，勿改>
cipherkey = <仓库公共协议密钥：从原始 config.ini 复制，勿改>
md5key = <仓库公共协议密钥：从原始 config.ini 复制，勿改>
platform = android
app_edition = 3.6.6
school_login_url = appLogin
school_id = 197
school_name = 洛阳理工学院

[User]
token =
device_id =
map_key =
device_name = Xiaomi
utc = 
uuid =
sign = 
sys_edition = 14
sys_version = 

# [Login] 学号密码：--login 时使用；登录会使手机端掉线，尽量少用。
# [Run] 打表参数：
#   face_status_missing：任务体没有 runFaceStatus 字段时是否按无人脸任务处理。
#     stop（默认，保守）| allow（该学校确无人脸核验时用；洛阳理工学院为 allow）
[Run]
face_status_missing = allow
# 围栏不再本地配置：服务端 getHomeRunInfo 的 fence 会自动校验
min_distance = 2.5
allow_overflow_distance = 2.0
single_mileage_min_offset = 0.5
single_mileage_max_offset = -0.5
cadence_min_offset = 0
cadence_max_offset = 0
split_count = 10
min_consume = 4.50
max_consume = 5.50
strides = 0.8

[Login]
# 只在 --login / 交互登录时使用
username = <你的学号>
password = <你的密码>

